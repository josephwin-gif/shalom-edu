<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery – Shalom Education Centre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/transitions.js"></script>
  <style>
    .upload-panel{background:#fff;border-radius:14px;border:1px solid var(--border);box-shadow:0 4px 20px rgba(45,80,22,.09);padding:2rem;margin-bottom:2rem;display:none}
    .upload-panel.open{display:block}
    .upload-panel-title{font-family:var(--font-head);color:var(--green);font-size:1.35rem;margin:0 0 1.5rem}
    .dropzone{border:2.5px dashed #d6c9b0;border-radius:12px;padding:2.5rem 1rem;text-align:center;cursor:pointer;background:#fdfaf5;transition:border-color .2s,background .2s;margin-bottom:1.25rem;user-select:none}
    .dropzone:hover,.dropzone.drag-over{border-color:var(--green);background:#f0f7ea}
    .dropzone-icon{font-size:2.5rem;display:block;margin-bottom:.5rem}
    .dropzone-text{color:var(--green);font-weight:600;font-size:1rem;margin:0 0 .25rem}
    .dropzone-hint{color:var(--brown);font-size:.85rem;margin:0}
    .preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:.65rem;margin-bottom:1rem}
    .preview-item{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:2px solid var(--gold)}
    .preview-item img{width:100%;height:100%;object-fit:cover;display:block}
    .preview-remove{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .up-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-bottom:1.25rem}
    .up-label{display:block;font-size:.88rem;font-weight:700;color:var(--green);margin-bottom:.35rem}
    .up-input{width:100%;padding:.6rem .85rem;font-size:.98rem;border:1px solid var(--border);border-radius:7px;background:#fdfaf5;font-family:var(--font-body);color:var(--text);box-sizing:border-box;outline:none;transition:border-color .2s}
    .up-input:focus{border-color:var(--green)}
    .prog-wrap{display:none;margin-bottom:1rem}
    .prog-wrap.show{display:block}
    .prog-track{background:#e8e0d0;border-radius:50px;height:10px;overflow:hidden;margin-bottom:.35rem}
    .prog-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:50px;transition:width .3s ease;width:0%}
    .prog-text{font-size:.85rem;color:var(--brown)}
    .up-actions{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
    .up-btn{background:var(--green);color:var(--cream);border:none;border-radius:8px;padding:.72rem 1.75rem;font-size:.95rem;font-weight:600;cursor:pointer;font-family:var(--font-body);transition:opacity .2s}
    .up-btn:disabled{opacity:.5;cursor:not-allowed}
    .up-btn-cancel{background:transparent;color:var(--brown);border:1px solid var(--brown);border-radius:8px;padding:.7rem 1.25rem;font-size:.95rem;cursor:pointer;font-family:var(--font-body)}
    .gallery-topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem;margin-bottom:1.5rem}
    .toggle-btn{background:var(--green);color:var(--cream);border:none;border-radius:8px;padding:.65rem 1.4rem;font-size:.92rem;font-weight:600;cursor:pointer;font-family:var(--font-body);display:flex;align-items:center;gap:.4rem;transition:background .2s}
    .toggle-btn.is-open{background:var(--brown)}
    .gitem{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/3;background:var(--border);cursor:pointer;transition:transform .2s}
    .gitem:hover{transform:scale(1.02)}
    .gitem img{width:100%;height:100%;object-fit:cover;display:block}
    .gitem-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(45,80,22,.82) 0%,transparent 55%);opacity:0;transition:opacity .22s;display:flex;align-items:flex-end;padding:.7rem;pointer-events:none;border-radius:10px}
    .gitem:hover .gitem-overlay{opacity:1}
    .gitem-caption{color:#fff;font-size:.82rem;line-height:1.4;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.4)}
    .gitem-cat{display:inline-block;background:rgba(201,168,76,.9);color:#1a3009;padding:.1rem .5rem;border-radius:50px;font-size:.7rem;font-weight:700;margin-bottom:.25rem}
    .gitem-del{position:absolute;top:6px;right:6px;background:rgba(192,57,43,.85);color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:.75rem;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:5}
    .gitem:hover .gitem-del{display:flex}
    /* Edit modal */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:600;display:none;align-items:center;justify-content:center;padding:1rem}
    .modal-bg.open{display:flex}
    .modal-box{background:#fff;border-radius:14px;padding:2rem;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
    .modal-title{font-family:var(--font-head);color:var(--green);font-size:1.2rem;margin:0 0 1.25rem}
    /* Error box */
    .err-box{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;padding:1rem 1.25rem;border-radius:8px;margin-bottom:1rem;font-size:.92rem;display:none}
    .err-box.show{display:block}
    .ok-box{background:#dcfce7;border:1px solid #86efac;color:#166534;padding:1rem 1.25rem;border-radius:8px;margin-bottom:1rem;font-size:.92rem;display:none}
    .ok-box.show{display:block}
  </style>
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand" href="index.html">
    <span id="navbar-brand-logo"></span>
    <span id="navbar-brand-name">Shalom Education Centre</span>
  </a>
  <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  <ul class="nav-links" id="nav-links"></ul>
</nav>

<div class="page-header">
  <h1 id="page-title">Gallery</h1>
  <p id="page-desc">Moments from Shalom Education Centre</p>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lightbox-close" id="lb-close">✕</button>
  <button id="lb-prev" style="position:absolute;left:1rem;background:rgba(255,255,255,.12);border:none;color:#fff;width:44px;height:44px;border-radius:50%;font-size:1.5rem;cursor:pointer;z-index:2">‹</button>
  <div style="text-align:center;max-width:90vw;position:relative;z-index:1">
    <img class="lightbox-img" id="lb-img" src="" alt="">
    <p class="lightbox-caption" id="lb-caption" style="margin-top:.75rem"></p>
    <span id="lb-cat" style="background:rgba(201,168,76,.25);color:#C9A84C;padding:.2rem .75rem;border-radius:50px;font-size:.78rem;font-weight:700"></span>
    <p id="lb-counter" style="color:rgba(255,255,255,.3);font-size:.78rem;margin-top:.5rem"></p>
  </div>
  <button id="lb-next" style="position:absolute;right:1rem;background:rgba(255,255,255,.12);border:none;color:#fff;width:44px;height:44px;border-radius:50%;font-size:1.5rem;cursor:pointer;z-index:2">›</button>
</div>

<!-- Edit modal -->
<div class="modal-bg" id="edit-modal">
  <div class="modal-box">
    <h3 class="modal-title">✏️ Edit Photo</h3>
    <input type="hidden" id="edit-id">
    <div style="margin-bottom:1rem">
      <label class="up-label">Caption / Description</label>
      <textarea class="up-input" id="edit-caption" rows="3" placeholder="Describe this photo..."></textarea>
    </div>
    <div style="margin-bottom:1.5rem">
      <label class="up-label">Category</label>
      <select class="up-input" id="edit-cat">
        <option value="">– No category –</option>
        <option>Events</option><option>Sports</option><option>Classroom</option>
        <option>Celebrations</option><option>Campus</option><option>Other</option>
      </select>
    </div>
    <div style="display:flex;gap:.75rem">
      <button id="edit-save-btn" style="flex:1;background:var(--green);color:var(--cream);border:none;border-radius:8px;padding:.75rem;font-family:var(--font-body);font-size:1rem;font-weight:600;cursor:pointer">Save Changes</button>
      <button id="edit-cancel-btn" style="background:transparent;color:var(--brown);border:1px solid var(--brown);border-radius:8px;padding:.75rem 1.25rem;font-family:var(--font-body);font-size:1rem;cursor:pointer">Cancel</button>
    </div>
  </div>
</div>

<section class="section">
  <div class="section-inner">

    <!-- Alerts -->
    <div class="err-box" id="err-box"></div>
    <div class="ok-box"  id="ok-box"></div>

    <!-- Top bar -->
    <div class="gallery-topbar">
      <div class="filter-bar" id="filter-bar" style="margin-bottom:0;flex-wrap:wrap">
        <button class="filter-btn active" data-cat="All" id="filter-all">All</button>
      </div>
      <button class="toggle-btn" id="toggle-btn">📷 Upload Photos</button>
    </div>

    <!-- Upload panel -->
    <div class="upload-panel" id="upload-panel">
      <h2 class="upload-panel-title">📷 Upload Photos to Gallery</h2>

      <!-- Step 1: pick files -->
      <div class="dropzone" id="dropzone">
        <span class="dropzone-icon">🖼️</span>
        <p class="dropzone-text">Click here or drag &amp; drop photos</p>
        <p class="dropzone-hint">JPG · PNG · WEBP · Select multiple at once</p>
      </div>
      <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,image/gif" multiple style="display:none">

      <!-- Previews -->
      <div class="preview-grid" id="preview-grid" style="display:none"></div>
      <p id="sel-count" style="color:var(--green);font-size:.88rem;font-weight:600;margin-bottom:1rem;display:none"></p>

      <!-- Step 2: caption & category -->
      <div class="up-fields">
        <div>
          <label class="up-label">Caption / Description</label>
          <textarea class="up-input" id="up-caption" rows="2"
            placeholder="e.g. Sports Day 2025 — students competing in 100m race"></textarea>
        </div>
        <div>
          <label class="up-label">Category</label>
          <select class="up-input" id="up-cat">
            <option value="">– No category –</option>
            <option value="Events">Events</option>
            <option value="Sports">Sports</option>
            <option value="Classroom">Classroom</option>
            <option value="Celebrations">Celebrations</option>
            <option value="Campus">Campus</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <!-- Progress -->
      <div class="prog-wrap" id="prog-wrap">
        <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
        <p class="prog-text" id="prog-text">Uploading...</p>
      </div>

      <!-- Buttons -->
      <div class="up-actions">
        <button class="up-btn" id="up-btn" disabled>Upload Photos</button>
        <button class="up-btn-cancel" id="up-cancel-btn">Cancel</button>
      </div>
    </div>

    <!-- Gallery -->
    <p id="photo-count" style="color:var(--brown);font-size:.88rem;margin-bottom:1rem"></p>
    <div class="gallery-grid" id="gallery-grid">
      <div class="skeleton" style="aspect-ratio:4/3"></div>
      <div class="skeleton" style="aspect-ratio:4/3"></div>
      <div class="skeleton" style="aspect-ratio:4/3"></div>
      <div class="skeleton" style="aspect-ratio:4/3"></div>
    </div>

  </div>
</section>

<footer id="footer"></footer>

<script type="module">
  import { supabase, initNavbar, initFooter } from './js/supabase.js';
  import { t } from './js/lang.js';

  // ── state ──
  let allPhotos   = [];
  let filtered    = [];
  let lbIndex     = 0;
  let selFiles    = [];   // selected File objects
  const BUCKET    = 'gallery-photos';

  // ── translations ──
  document.getElementById('page-title').textContent = t('media_title');
  document.getElementById('page-desc').textContent  = t('media_desc');
  document.getElementById('filter-all').textContent = t('filter_all');

  // ── helpers ──
  function showErr(msg) {
    const el = document.getElementById('err-box');
    el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 6000);
  }
  function showOk(msg) {
    const el = document.getElementById('ok-box');
    el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 4500);
  }

  // ── init ──
  async function init() {
    await initNavbar('Gallery');
    await initFooter();
    await fetchPhotos();
  }

  // ── fetch & render gallery ──
  async function fetchPhotos() {
    const { data, error } = await supabase
      .from('gallery_photos').select('*')
      .order('created_at', { ascending: false });
    if (error) { showErr('Could not load gallery: ' + error.message); return; }
    allPhotos = data || [];
    buildFilters();
    applyFilter('All');
  }

  function buildFilters() {
    const bar  = document.getElementById('filter-bar');
    bar.querySelectorAll('.filter-btn:not(#filter-all)').forEach(b => b.remove());
    const cats = [...new Set(allPhotos.map(p => p.category).filter(Boolean))];
    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn'; btn.dataset.cat = cat;
      btn.textContent = `${cat} (${allPhotos.filter(p => p.category === cat).length})`;
      bar.appendChild(btn);
    });
  }

  function applyFilter(cat) {
    filtered = cat === 'All' ? allPhotos : allPhotos.filter(p => p.category === cat);
    document.querySelectorAll('.filter-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.cat === cat));
    const c = filtered.length;
    document.getElementById('photo-count').textContent =
      c > 0 ? `${c} photo${c!==1?'s':''} · Hover to see caption · Click to enlarge` : '';
    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById('gallery-grid');
    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <span class="emoji">🖼️</span>
        <p>No photos yet. Click "Upload Photos" to add some.</p>
      </div>`;
      return;
    }
    grid.innerHTML = filtered.map((p, i) => `
      <div class="gitem" data-i="${i}" tabindex="0" role="button" aria-label="${p.caption||'Photo'}">
        <img src="${p.photo_url}" alt="${p.caption||''}" loading="lazy">
        <div class="gitem-overlay">
          <div>
            ${p.category ? `<span class="gitem-cat">${p.category}</span><br>` : ''}
            ${p.caption  ? `<span class="gitem-caption">${p.caption}</span>` : ''}
          </div>
        </div>
        <button class="gitem-del" data-id="${p.id}" title="Delete">✕</button>
      </div>`).join('');

    grid.querySelectorAll('.gitem').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target.classList.contains('gitem-del')) return;
        openLightbox(+el.dataset.i);
      });
      el.addEventListener('keydown', e => { if (e.key === 'Enter') openLightbox(+el.dataset.i); });
    });
    grid.querySelectorAll('.gitem-del').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); deletePhoto(btn.dataset.id); });
    });
  }

  // ── lightbox ──
  function openLightbox(i) {
    lbIndex = i; const p = filtered[i];
    document.getElementById('lb-img').src = p.photo_url;
    document.getElementById('lb-img').alt = p.caption || '';
    document.getElementById('lb-caption').textContent = p.caption || '';
    document.getElementById('lb-cat').textContent     = p.category || '';
    document.getElementById('lb-counter').textContent = `${i+1} / ${filtered.length}`;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  function navLb(d) {
    lbIndex = (lbIndex + d + filtered.length) % filtered.length;
    openLightbox(lbIndex);
  }
  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-prev').addEventListener('click', e => { e.stopPropagation(); navLb(-1); });
  document.getElementById('lb-next').addEventListener('click', e => { e.stopPropagation(); navLb(+1); });
  document.getElementById('lightbox').addEventListener('click', e => { if (e.target===e.currentTarget) closeLightbox(); });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key==='Escape')     closeLightbox();
    if (e.key==='ArrowRight') navLb(+1);
    if (e.key==='ArrowLeft')  navLb(-1);
  });

  // ── filter bar ──
  document.getElementById('filter-bar').addEventListener('click', e => {
    if (e.target.classList.contains('filter-btn')) applyFilter(e.target.dataset.cat);
  });

  // ── upload panel toggle ──
  document.getElementById('toggle-btn').addEventListener('click', () => {
    const panel  = document.getElementById('upload-panel');
    const isOpen = panel.classList.toggle('open');
    const btn    = document.getElementById('toggle-btn');
    btn.textContent = isOpen ? '✕ Close' : '📷 Upload Photos';
    btn.classList.toggle('is-open', isOpen);
    if (isOpen) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  // ── file picking ──
  const dropzone  = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover',  e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault(); dropzone.classList.remove('drag-over');
    addFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', e => addFiles(e.target.files));

  function addFiles(fileList) {
    const newFiles = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    if (newFiles.length === 0) { showErr('Please select image files only (JPG, PNG, WEBP).'); return; }
    selFiles = [...selFiles, ...newFiles];
    renderPreviews();
  }

  function renderPreviews() {
    const grid = document.getElementById('preview-grid');
    const cnt  = document.getElementById('sel-count');
    if (selFiles.length === 0) {
      grid.style.display = 'none'; cnt.style.display = 'none';
      document.getElementById('up-btn').disabled = true;
      document.getElementById('up-btn').textContent = 'Upload Photos';
      return;
    }
    grid.style.display = 'grid';
    cnt.style.display  = 'block';
    cnt.textContent    = `${selFiles.length} photo${selFiles.length!==1?'s':''} ready to upload`;
    grid.innerHTML = selFiles.map((f, i) => `
      <div class="preview-item">
        <img src="${URL.createObjectURL(f)}" alt="preview ${i}">
        <button class="preview-remove" data-i="${i}">✕</button>
      </div>`).join('');
    grid.querySelectorAll('.preview-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        selFiles.splice(+btn.dataset.i, 1);
        renderPreviews();
      });
    });
    const upBtn = document.getElementById('up-btn');
    upBtn.disabled    = false;
    upBtn.textContent = `Upload ${selFiles.length} Photo${selFiles.length!==1?'s':''}`;
  }

  // ── UPLOAD ──────────────────────────────────────────────────
  document.getElementById('up-btn').addEventListener('click', async () => {
    if (selFiles.length === 0) { showErr('Please select at least one photo first.'); return; }

    const caption  = document.getElementById('up-caption').value.trim();
    const category = document.getElementById('up-cat').value;
    const upBtn    = document.getElementById('up-btn');
    const progWrap = document.getElementById('prog-wrap');
    const progFill = document.getElementById('prog-fill');
    const progText = document.getElementById('prog-text');

    // Lock UI
    upBtn.disabled    = true;
    upBtn.textContent = 'Uploading...';
    progWrap.classList.add('show');

    let done = 0;
    const rows = [];

    for (const file of selFiles) {
      // Build a safe filename
      const ext  = file.name.split('.').pop().replace(/[^a-z0-9]/gi,'').toLowerCase() || 'jpg';
      const name = `photo_${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;

      // Upload to Supabase Storage
      const { data: storageData, error: storageErr } = await supabase
        .storage.from(BUCKET).upload(name, file, {
          cacheControl: '3600',
          upsert: false,
          contentType: file.type,
        });

      if (storageErr) {
        // Show exact Supabase error so we know what's wrong
        showErr(`Upload failed for "${file.name}": ${storageErr.message}`);
        console.error('Storage error:', storageErr);
        continue;
      }

      // Get public URL
      const { data: urlData } = supabase.storage.from(BUCKET).getPublicUrl(name);
      if (!urlData?.publicUrl) {
        showErr(`Could not get URL for "${file.name}". Check bucket is Public.`);
        continue;
      }

      rows.push({
        photo_url:  urlData.publicUrl,
        caption:    caption  || null,
        category:   category || null,
        created_at: new Date().toISOString(),
      });

      done++;
      progFill.style.width = Math.round((done / selFiles.length) * 100) + '%';
      progText.textContent = `Uploaded ${done} of ${selFiles.length}...`;
    }

    // Save rows to database
    if (rows.length > 0) {
      const { error: dbErr } = await supabase.from('gallery_photos').insert(rows);
      if (dbErr) {
        showErr('Photos saved to storage but database insert failed: ' + dbErr.message);
        console.error('DB error:', dbErr);
      } else {
        showOk(`✅ ${rows.length} photo${rows.length!==1?'s':''} uploaded successfully!`);
        resetUploadForm();
        await fetchPhotos();
      }
    } else if (done === 0) {
      showErr('No photos were uploaded. Check the console (F12) for details and make sure your storage bucket "gallery-photos" exists and is Public.');
    }

    // Unlock UI
    progWrap.classList.remove('show');
    progFill.style.width = '0%';
    upBtn.disabled    = false;
    upBtn.textContent = 'Upload Photos';
  });

  function resetUploadForm() {
    selFiles = [];
    fileInput.value = '';
    document.getElementById('up-caption').value = '';
    document.getElementById('up-cat').value     = '';
    document.getElementById('preview-grid').innerHTML  = '';
    document.getElementById('preview-grid').style.display = 'none';
    document.getElementById('sel-count').style.display    = 'none';
    document.getElementById('up-btn').disabled    = true;
    document.getElementById('up-btn').textContent = 'Upload Photos';
    // Close panel
    document.getElementById('upload-panel').classList.remove('open');
    document.getElementById('toggle-btn').textContent = '📷 Upload Photos';
    document.getElementById('toggle-btn').classList.remove('is-open');
  }

  document.getElementById('up-cancel-btn').addEventListener('click', resetUploadForm);

  // ── delete ──
  async function deletePhoto(id) {
    if (!confirm('Delete this photo permanently?')) return;
    const photo = allPhotos.find(p => p.id === id);
    if (photo?.photo_url) {
      try {
        const parts = photo.photo_url.split(`/${BUCKET}/`);
        if (parts[1]) await supabase.storage.from(BUCKET).remove([parts[1]]);
      } catch (_) {}
    }
    const { error } = await supabase.from('gallery_photos').delete().eq('id', id);
    if (error) { showErr('Delete failed: ' + error.message); return; }
    showOk('Photo deleted.');
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    await fetchPhotos();
  }

  // ── edit modal ──
  document.querySelectorAll('[data-edit]').forEach(() => {});
  document.getElementById('edit-cancel-btn').addEventListener('click', () =>
    document.getElementById('edit-modal').classList.remove('open'));
  document.getElementById('edit-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) document.getElementById('edit-modal').classList.remove('open');
  });
  document.getElementById('edit-save-btn').addEventListener('click', async () => {
    const id  = document.getElementById('edit-id').value;
    const cap = document.getElementById('edit-caption').value.trim();
    const cat = document.getElementById('edit-cat').value;
    const { error } = await supabase.from('gallery_photos')
      .update({ caption: cap||null, category: cat||null }).eq('id', id);
    if (error) { showErr('Update failed: ' + error.message); return; }
    document.getElementById('edit-modal').classList.remove('open');
    showOk('Photo updated!');
    await fetchPhotos();
  });

  init();
</script>
</body>
</html>
